
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Settings | ROFARIM</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .settings-container {
            max-width: 900px;
            margin: 45px auto;
            padding: 20px;
        }

        .settings-form {
            background: #101d32;
            border: 1px solid #c6a45c;
            border-radius: 12px;
            padding: 25px;
            margin-top: 25px;
        }

        .settings-form h2 {
            color: #d6b66e;
            margin-bottom: 20px;
        }

        .settings-form label {
            display: block;
            color: #d6b66e;
            margin-bottom: 8px;
        }

        .settings-form input,
        .settings-form textarea {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            background: #081426;
            color: white;
            border: 1px solid #526078;
            border-radius: 6px;
            font-family: inherit;
        }

        .settings-form textarea {
            min-height: 90px;
        }

        .settings-form button {
            padding: 13px 25px;
            background: #c6a45c;
            color: #081426;
            border: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .settings-note {
            color: #e5c985;
            margin-top: 18px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header class="header">
    <div class="logo">
        <h1>ROFARIM</h1>
        <p>WEBSITE SETTINGS</p>
    </div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="index.html">Website</a>
    </nav>
</header>

<main class="settings-container">

    <form class="settings-form" id="settingsForm">

        <h2>General Website Settings</h2>

        <label>Website Name</label>
        <input type="text" value="ROFARIM" id="siteName">

        <label>Organization Name</label>
        <input type="text"
            value="ROFARIM Pharmaceutical Company Limited"
            id="organization">

        <label>Tagline</label>
        <textarea id="tagline">Advancing Hormone Science, Molecular Medicine & Biomedical Discovery.</textarea>

        <label>Contact Email</label>
        <input type="email"
            value="rn.robinmondol@gmail.com"
            id="email">

        <label>Phone Number</label>
        <input type="text"
            value="+880 1793-175803"
            id="phone">

        <label>Location</label>
        <input type="text"
            value="Bangladesh"
            id="location">

        <label>Facebook URL</label>
        <input type="url" id="facebook"
            placeholder="https://facebook.com/...">

        <label>LinkedIn URL</label>
        <input type="url" id="linkedin"
            placeholder="https://linkedin.com/...">

        <label>Website Description</label>
        <textarea id="description"
            placeholder="Describe ROFARIM..."></textarea>

        <button type="submit">Preview Settings</button>

        <p id="status" class="settings-note">
            Settings preview demonstration.
        </p>

    </form>

</main>

<footer class="footer">
    <h2>ROFARIM</h2>
    <p>Website Administration</p>
</footer>

<script>
    document.getElementById("settingsForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            document.getElementById("status").textContent =
                "Settings preview received. Permanent saving requires a backend and database.";
        });
</script>

</body>
</html>
